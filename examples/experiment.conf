#[
Настройки лабораторного эксперимента.
Калибровка используется двумя датчиками.
]#
def gain := 0.025
def calibration := { offset = 0.01, scale = ^(gain) }
{
    experiment = {
        sample = { temperature = 21.5, pressure = 101.3 },
        sensorA = ^(calibration),
        sensorB = ^(calibration),
    },
}
